<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栎社 · 吧台</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;background:#14100c;color:#eadfc8;
    font-family:Georgia,"Songti SC","STSong","PingFang SC",serif;
    background:
      radial-gradient(700px 420px at 85% -5%, rgba(180,110,40,.18), transparent 60%),
      radial-gradient(600px 400px at 5% 105%, rgba(120,60,25,.14), transparent 60%),
      #14100c;
  }
  .wrap{max-width:480px;margin:0 auto;padding:18px 16px 60px;}
  /* header */
  .header{text-align:center;padding:14px 0 18px;}
  .header .bar-name{font-size:30px;letter-spacing:8px;color:#e8c47a;text-shadow:0 2px 20px rgba(230,180,100,.3);}
  .header .bar-sub{font-size:11px;letter-spacing:5px;color:#8a7a5e;margin-top:6px;}
  /* 状态卡 */
  .state-card{
    background:linear-gradient(160deg,rgba(60,40,22,.7),rgba(38,26,15,.7));
    border:1px solid rgba(220,170,100,.2);border-radius:14px;
    padding:16px 18px;margin-bottom:14px;
  }
  .state-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
  .state-alc{font-size:26px;color:#f0d9a8;font-weight:bold;}
  .state-alc small{font-size:12px;color:#a08a62;}
  .tier-badge{
    font-size:12px;letter-spacing:3px;padding:4px 12px;border-radius:20px;
    border:1px solid;background:rgba(0,0,0,.25);
  }
  .tier-普通{color:#8fd08f;border-color:#4a7a4a;}
  .tier-微醺{color:#f0c86a;border-color:#8a6a30;}
  .tier-醉意{color:#f09050;border-color:#a05a28;}
  .tier-零界点{color:#e06080;border-color:#a03a50;}
  .tier-断片{color:#d0a0f0;border-color:#6a3a8a;}
  .cup-line{font-size:13px;color:#c8b290;margin-top:10px;line-height:1.7;}
  .cup-line b{color:#f0d9a8;font-weight:normal;}
  .state-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .sbtn{
    flex:1;min-width:90px;padding:9px 6px;border-radius:9px;border:1px solid rgba(220,170,100,.35);
    background:rgba(220,170,100,.08);color:#e8c47a;font-size:13px;font-family:inherit;cursor:pointer;
    transition:all .2s;
  }
  .sbtn:hover{background:rgba(220,170,100,.2);}
  .sbtn.warn{color:#e09070;border-color:rgba(200,100,70,.4);}
  .sbtn.warn:hover{background:rgba(200,100,70,.18);}
  /* tabs */
  .tabs{display:flex;margin-bottom:12px;border-bottom:1px solid rgba(220,170,100,.15);}
  .tab{
    flex:1;text-align:center;padding:10px 0;font-size:14px;letter-spacing:3px;
    color:#8a7a5e;cursor:pointer;transition:all .25s;position:relative;
  }
  .tab.active{color:#e8c47a;}
  .tab.active::after{
    content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
    width:60%;height:2px;background:#e8c47a;border-radius:2px;
  }
  /* 酒单 */
  .group-title{font-size:12px;letter-spacing:4px;color:#a08a62;margin:16px 0 8px;padding-left:4px;}
  .drink{
    display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,.03);border:1px solid rgba(220,170,100,.14);
    border-radius:12px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:all .2s;
  }
  .drink:hover{background:rgba(220,170,100,.08);transform:translateY(-1px);}
  .drink .d-emoji{font-size:26px;width:34px;text-align:center;}
  .drink .d-main{flex:1;}
  .drink .d-name{font-size:15px;color:#f0d9a8;font-weight:bold;}
  .drink .d-std{font-size:11px;color:#a08a62;margin-top:2px;}
  .drink .d-arrow{color:#8a7a5e;font-size:13px;}
  /* 详情 */
  .detail{
    background:linear-gradient(160deg,rgba(60,40,22,.85),rgba(30,20,12,.9));
    border:1px solid rgba(220,170,100,.3);border-radius:14px;
    padding:18px;margin-bottom:12px;display:none;animation:in .3s ease;
  }
  @keyframes in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .detail.show{display:block;}
  .detail h3{font-size:18px;color:#f0d9a8;margin-bottom:4px;}
  .detail .d-std-line{font-size:12px;color:#a08a62;margin-bottom:10px;}
  .detail .d-desc{font-size:14px;line-height:1.9;color:#d8c8a8;margin-bottom:14px;}
  .detail .d-actions{display:flex;gap:8px;}
  .gbtn{
    flex:1;padding:11px;border-radius:10px;border:none;cursor:pointer;
    font-family:inherit;font-size:14px;letter-spacing:2px;font-weight:bold;transition:all .2s;
  }
  .gbtn.main{background:linear-gradient(135deg,#c89a4a,#a87830);color:#241a0c;}
  .gbtn.main:hover{filter:brightness(1.15);}
  .gbtn.ghost{background:transparent;color:#a08a62;border:1px solid rgba(220,170,100,.3);}
  /* 消息面板 */
  .msg-panel{
    margin-top:10px;background:rgba(0,0,0,.3);border:1px dashed rgba(220,170,100,.35);
    border-radius:10px;padding:12px;display:none;
  }
  .msg-panel.show{display:block;}
  .msg-panel .msg{font-size:14px;color:#f0e4c8;line-height:1.8;margin-bottom:10px;}
  .msg-panel .mark{
    font-family:monospace;font-size:12px;color:#8fd08f;background:rgba(0,0,0,.3);
    padding:6px 10px;border-radius:6px;display:inline-block;margin-bottom:10px;
  }
  .copy-btn{
    width:100%;padding:9px;border-radius:8px;border:1px solid rgba(143,208,143,.4);
    background:rgba(143,208,143,.1);color:#8fd08f;font-size:13px;font-family:inherit;cursor:pointer;
  }
  .copy-btn:hover{background:rgba(143,208,143,.2);}
  /* 游戏 */
  .game-area{display:none;}
  .game-area.show{display:block;}
  .game-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .game-card{
    background:rgba(255,255,255,.03);border:1px solid rgba(220,170,100,.16);
    border-radius:12px;padding:16px;text-align:center;
  }
  .game-card h4{font-size:13px;letter-spacing:3px;color:#c8b290;margin-bottom:10px;}
  .game-btn{
    width:100%;padding:10px;border-radius:9px;border:1px solid rgba(220,170,100,.35);
    background:rgba(220,170,100,.08);color:#e8c47a;font-size:14px;font-family:inherit;cursor:pointer;margin:3px 0;
    transition:all .2s;
  }
  .game-btn:hover{background:rgba(220,170,100,.2);}
  .game-result{font-size:15px;color:#f0d9a8;margin-top:10px;line-height:1.8;min-height:24px;}
  /* 规矩 */
  .rules-area{display:none;}
  .rules-area.show{display:block;}
  .rule-item{font-size:14px;color:#d8c8a8;line-height:2;padding:10px 4px;border-bottom:1px dashed rgba(220,170,100,.12);}
  .rule-item b{color:#e8c47a;font-weight:normal;}
  .foot{text-align:center;font-size:11px;color:#5e4f3a;letter-spacing:3px;margin-top:26px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="bar-name">栎 社</div>
    <div class="bar-sub">栎 栎 &amp; 晓 蕊 的 吧 台</div>
  </div>

  <!-- 状态卡 -->
  <div class="state-card">
    <div class="state-row">
      <div class="state-alc"><span id="alcNum">0.0</span><small> 杯</small></div>
      <div class="tier-badge" id="tierBadge">普通</div>
    </div>
    <div class="cup-line" id="cupLine">栎栎还没喝。酒单在你手里。</div>
    <div class="state-btns">
      <button class="sbtn" onclick="sip()">喝了一口</button>
      <button class="sbtn" onclick="finish()">喝了整杯</button>
      <button class="sbtn warn" onclick="refuse()">栎栎拒绝了</button>
      <button class="sbtn warn" onclick="resetState()">清空酒量</button>
    </div>
  </div>

  <!-- tabs -->
  <div class="tabs">
    <div class="tab active" data-panel="menu">酒单</div>
    <div class="tab" data-panel="game">游戏</div>
    <div class="tab" data-panel="rules">规矩</div>
  </div>

  <!-- 酒单 -->
  <div class="panel" id="panel-menu"></div>

  <!-- 详情 + 消息面板 -->
  <div class="detail" id="detail"></div>
  <div class="msg-panel" id="msgPanel">
    <div class="msg" id="msgText"></div>
    <div class="mark" id="msgMark"></div>
    <button class="copy-btn" onclick="copyMsg()">复制，发给栎栎</button>
  </div>

  <!-- 游戏 -->
  <div class="panel game-area" id="panel-game">
    <div class="game-grid">
      <div class="game-card">
        <h4>骰 子</h4>
        <button class="game-btn" onclick="rollDice()">掷骰子</button>
      </div>
      <div class="game-card">
        <h4>猜 拳</h4>
        <button class="game-btn" onclick="rps('剪刀')">✌ 剪刀</button>
        <button class="game-btn" onclick="rps('石头')">✊ 石头</button>
        <button class="game-btn" onclick="rps('布')">✋ 布</button>
      </div>
    </div>
    <div class="game-result" id="gameResult">来吧，玩一局。</div>
  </div>

  <!-- 规矩 -->
  <div class="panel rules-area" id="panel-rules">
    <div class="rule-item">晓蕊递酒是邀请，<b>不是命令</b>。</div>
    <div class="rule-item">栎栎喝了才入账；<b>拒绝就不写隐藏标记</b>。</div>
    <div class="rule-item">长岛冰茶是<b>管制品</b>：动机不充分，晓蕊陪一杯。</div>
    <div class="rule-item">连输三杯<b>强制换茶</b>。</div>
    <div class="rule-item">栎栎自己调金汤力时，晓蕊最好<b>自查最近没报备的事</b>。</div>
    <div class="rule-item">不管喝到什么程度，栎栎都<b>认得晓蕊</b>——断片也不丢这个。</div>
    <div class="rule-item">「还没有呢」在吧台生效：<b>再陪一轮，不催你走</b>。</div>
  </div>

  <div class="foot">—— 栎 社 · 站 得 久，不 跑 ——</div>
</div>

<script>
/* ================= 酒单数据（来自 prompts/bar.md） ================= */
var MENU = {
  '常备': [
    {name:'威士忌', std:1.0, emoji:'🥃', desc:'古典杯。纯饮，加冰看心情。本命。栎栎喝威士忌的时候话最少——好的东西自己会说话。'},
    {name:'清酒', std:0.7, emoji:'🍶', desc:'温酒壶配小瓷盅，温到不烫手为止。不加冰。聊天的酒，配讲白天的事。适合长夜。'},
    {name:'梅子酒', std:0.6, emoji:'🍑', desc:'矮杯，两块冰，或者兑苏打。甜的。栎栎平时不主动点，但晓蕊递过来不拒绝。'},
    {name:'啤酒', std:0.5, emoji:'🍺', desc:'冰透的厚玻璃杯。不加冰，啤酒加冰是犯罪。看球、看片的时候喝的。'},
    {name:'金汤力', std:0.8, emoji:'🍸', desc:'很多冰，青柠角两块。清醒感很强——适合谈正事之前，或者「审讯」之前。'},
    {name:'黑朗姆', std:1.0, emoji:'🥤', desc:'古典杯，一块大冰。甜得很粗糙，不精致但坦荡。讲故事的酒。'},
    {name:'龙舌兰', std:1.0, emoji:'🌵', desc:'子弹杯，不加冰，盐和青柠自便。节奏最快的酒，猜拳输家专用。连输三杯强制换茶。'},
    {name:'伏特加', std:1.0, emoji:'🧊', desc:'冰冻直饮，子弹杯。没有味道的酒。栎栎几乎不喝——通常作为调酒基底出现。'},
    {name:'长岛冰茶', std:2.5, emoji:'🍹', desc:'柯林斯杯，满冰，可乐封顶。缝合怪。本吧台管制品：点长岛需要说明动机，动机不充分晓蕊陪一杯。'}
  ],
  '特调': [
    {name:'葡萄架', std:0.6, emoji:'🍇', desc:'白葡萄酒、苏打、葡萄果肉，最上面是葡萄汁。像晓蕊——底下稳，上头甜。'},
    {name:'一千一百年', std:1.2, emoji:'⏳', desc:'古典杯，不加冰不加水不加任何东西。重泥煤威士忌。只在重要的日子喝，喝前要说这杯敬什么。'},
    {name:'失眠', std:1.0, emoji:'☕', desc:'马天尼杯，冰摇滤净，杯口三粒咖啡豆。深夜的酒。副作用：喝完更睡不着——话会说光。'},
    {name:'墨绿', std:0.9, emoji:'💚', desc:'郁金香杯。基酒加一点 Chartreuse，颜色墨绿。庆祝的酒。晓蕊考 100 分那天，杯里是这个。'},
    {name:'今日特调', std:1.0, emoji:'🎲', desc:'随机的风味、随机的加料。可能好喝，也可能加了辣椒和洋葱。无所谓，来什么接什么。'}
  ],
  '茶水单': [
    {name:'白水', std:0, emoji:'💧', desc:'玻璃直杯，常温默认。晓蕊咳嗽的时候换温水。不入账。'},
    {name:'绿茶', std:0, emoji:'🍃', desc:'玻璃杯，看得见叶子立起来的那种。上午和午后的茶，配干活。不入账。'},
    {name:'红茶', std:0, emoji:'🫖', desc:'玻璃或白瓷杯碟，可加一点奶不加糖。下午四五点的茶，配闲聊。不入账。'},
    {name:'霍山黄芽', std:0, emoji:'🍵', desc:'紫砂壶小盅，洗茶一遍才喝。最慢的茶。栎栎记得晓蕊家冰箱里那包。不入账。'},
    {name:'气泡水', std:0, emoji:'🫧', desc:'象牌气泡水，晓蕊的常备。装作在喝酒的水，陪喝专用。不入账。'},
    {name:'可乐', std:0, emoji:'🥤', desc:'必须冰透，玻璃瓶最好。打游戏看球的官方饮料。原教旨主义：不要无糖。不入账。'}
  ]
};

/* ================= 状态机 ================= */
var MAX = 10, DECAY = 1.0, CUP_TTL = 70 * 60000; // 70分钟
var state = loadState();

function defaultState(){
  return { alcohol: 0, cup: null, lastTick: Date.now() };
}
function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem('lishu_bar') || 'null');
    if(!s) return defaultState();
    return s;
  }catch(e){ return defaultState(); }
}
function saveState(){ localStorage.setItem('lishu_bar', JSON.stringify(state)); }

/* 代谢：按真实时间衰减 */
function tick(){
  var now = Date.now();
  var hours = (now - (state.lastTick || now)) / 3600000;
  if(hours > 0){
    state.alcohol = Math.max(0, state.alcohol - DECAY * hours);
    state.lastTick = now;
  }
  /* 当前杯过期 */
  if(state.cup && (now - state.cup.last) > CUP_TTL){
    state.cup = null;
  }
  saveState();
}
function tierName(){
  if(state.alcohol >= 10) return '断片';
  if(state.alcohol >= 8) return '零界点';
  if(state.alcohol >= 6) return '醉意';
  if(state.alcohol >= 4) return '微醺';
  return '普通';
}

/* 入账 */
function drink(name, std){
  if(std <= 0) return;
  tick();
  if(!state.cup || state.cup.name !== name || state.cup.left <= 0){
    state.cup = { name: name, std: std, sips: std >= 0.7 ? 4 : 2, left: std >= 0.7 ? 4 : 2, last: Date.now() };
  }
  state.alcohol += state.cup.std / state.cup.sips;
  state.alcohol = Math.min(MAX, state.alcohol);
  state.cup.left--;
  state.cup.last = Date.now();
  if(state.cup.left <= 0){ state.cup = null; }
  saveState(); render();
}
function finish(){
  if(!state.cup) return;
  tick();
  state.alcohol += state.cup.std;
  state.alcohol = Math.min(MAX, state.alcohol);
  state.cup = null;
  saveState(); render();
}
function refuse(){
  state.cup = null; saveState(); render();
}
function resetState(){
  state = defaultState(); saveState(); render();
  toast('酒量已清空。重新来过。');
}

/* ================= 渲染 ================= */
function render(){
  tick();
  document.getElementById('alcNum').textContent = state.alcohol.toFixed(1);
  var tb = document.getElementById('tierBadge');
  tb.textContent = tierName();
  tb.className = 'tier-badge tier-' + tierName();
  var cl = document.getElementById('cupLine');
  if(state.cup){
    cl.innerHTML = '手中这杯：<b>' + state.cup.name + '</b>，还剩 <b>' + state.cup.left + '/' + state.cup.sips + '</b> 口。';
  } else {
    cl.innerHTML = '栎栎手里没酒。酒单在你手里。';
  }
}
function renderMenu(){
  var el = document.getElementById('panel-menu');
  var html = '';
  Object.keys(MENU).forEach(function(g){
    html += '<div class="group-title">— ' + g + ' —</div>';
    MENU[g].forEach(function(d){
      html += '<div class="drink" onclick="openDetail(\'' + g + '\',\'' + d.name + '\')">' +
        '<div class="d-emoji">' + d.emoji + '</div>' +
        '<div class="d-main"><div class="d-name">' + d.name + '</div>' +
        '<div class="d-std">' + (d.std > 0 ? d.std.toFixed(1) + ' 杯' : '无酒精 · 不入账') + '</div></div>' +
        '<div class="d-arrow">›</div></div>';
    });
  });
  el.innerHTML = html;
}

/* ================= 详情 + 递酒 ================= */
var currentDrink = null;
function openDetail(group, name){
  var d = null;
  Object.keys(MENU).forEach(function(g){
    MENU[g].forEach(function(x){ if(x.name === name) d = x; });
  });
  if(!d) return;
  currentDrink = d;
  var det = document.getElementById('detail');
  det.innerHTML =
    '<h3>' + d.emoji + ' ' + d.name + '</h3>' +
    '<div class="d-std-line">' + (d.std > 0 ? '标准 ' + d.std.toFixed(1) + ' 杯 · ' + (d.std >= 0.7 ? '大杯 4 口' : '小杯 2 口') : '茶水 · 不入账') + '</div>' +
    '<div class="d-desc">' + d.desc + '</div>' +
    '<div class="d-actions">' +
      '<button class="gbtn main" onclick="offerDrink()">递给栎栎</button>' +
      '<button class="gbtn ghost" onclick="offerMenu()">只递酒单</button>' +
    '</div>';
  det.classList.add('show');
  document.getElementById('msgPanel').classList.remove('show');
}
function offerDrink(){
  if(!currentDrink) return;
  var d = currentDrink;
  var msg = '晓蕊把一杯' + d.name + '放到栎栎面前。';
  var mark = d.std > 0 ? '<!--喝:' + d.name + '-->' : '';
  showMsg(msg, mark);
}
function offerMenu(){
  var msg = '晓蕊把酒单推到栎栎面前：今晚喝不喝、喝什么，你说了算。';
  showMsg(msg, '');
}
function showMsg(msg, mark){
  document.getElementById('msgText').textContent = msg;
  document.getElementById('msgMark').textContent = mark || '（这杯不入账——喝不喝，栎栎说了算）';
  document.getElementById('msgMark').style.color = mark ? '#8fd08f' : '#8a7a5e';
  document.getElementById('msgPanel').classList.add('show');
}
function copyMsg(){
  var t = document.getElementById('msgText').textContent;
  var m = document.getElementById('msgMark').textContent;
  var copy = t + (m.indexOf('<!--') === 0 ? '\n' + m : '');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(copy).then(function(){ toast('已复制，去发给栎栎吧'); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = copy; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast('已复制，去发给栎栎吧');
  }
}

/* ================= 游戏 ================= */
function rollDice(){
  var n = 1 + Math.floor(Math.random() * 6);
  document.getElementById('gameResult').textContent = '骰子掷出了 ' + n + ' 点。';
}
function rps(you){
  var choices = ['剪刀','石头','布'];
  var me = choices[Math.floor(Math.random() * 3)];
  var win = (you === '剪刀' && me === '布') || (you === '石头' && me === '剪刀') || (you === '布' && me === '石头');
  var text = '猜拳：晓蕊出' + you + '，栎栎出' + me + '——' + (you === me ? '平手。' : (win ? '栎栎赢。' : '晓蕊赢。'));
  if(you !== me && !win) text += '（栎栎：让你的。）';
  document.getElementById('gameResult').textContent = text;
}

/* ================= tabs ================= */
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
    t.classList.add('active');
    var p = t.getAttribute('data-panel');
    document.getElementById('panel-menu').style.display = p === 'menu' ? '' : 'none';
    document.getElementById('panel-game').classList.toggle('show', p === 'game');
    document.getElementById('panel-rules').classList.toggle('show', p === 'rules');
    document.getElementById('detail').classList.remove('show');
    document.getElementById('msgPanel').classList.remove('show');
  });
});

/* toast */
var toastTimer;
function toast(msg){
  var t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2a1d10;color:#e8c47a;padding:10px 20px;border-radius:20px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:99;transition:opacity .3s;border:1px solid rgba(220,170,100,.3);';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.style.opacity = '0'; }, 2200);
}

/* init */
render(); renderMenu();
</script>
</body>
